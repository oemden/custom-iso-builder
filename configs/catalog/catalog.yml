nomenclature:
  ubuntu:
    iso_name: ubuntu-{version}-{flavor}-{arch}.iso
    iso_url: https://releases.ubuntu.com/{version}/{iso_name}
    checksum_url: https://releases.ubuntu.com/{version}/SHA256SUMS (SHA256)
    flavors: live-server, desktop
  debian:
    netinst:
      iso_name: debian-{version}-{arch}-netinst.iso
      iso_url: https://cdimage.debian.org/cdimage/archive/{version}/{arch}/iso-cd/{iso_name}
      checksum_url: https://cdimage.debian.org/cdimage/archive/{version}/{arch}/iso-cd/SHA512SUMS (SHA512)
    dvd:
      iso_name: debian-{version}-{arch}-DVD-1.iso
      iso_url: https://cdimage.debian.org/cdimage/archive/{version}/{arch}/iso-dvd/{iso_name}
      checksum_url: https://cdimage.debian.org/cdimage/archive/{version}/{arch}/iso-dvd/SHA512SUMS (SHA512)


