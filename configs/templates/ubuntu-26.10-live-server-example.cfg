# Linux Os Type Family ( use lowercase names like 'debian' or 'ubuntu' )
linux_os_type="ubuntu"
# ubuntu version and iso variables
# scaffolded by scripts/iso-catalog.sh from scripts/scaffolds/ubuntu.scaffold
debian_version="26.10"
debian_codename="stonking"
debian_arch="amd64"
debian_iso_name="ubuntu-26.10-live-server-amd64.iso"
iso_url="https://releases.ubuntu.com/26.10/ubuntu-26.10-live-server-amd64.iso"
iso_checksum="https://releases.ubuntu.com/26.10/SHA256SUMS"
iso_volume_name="ubuntu-26.10-amd64-netinst.iso"

# ## File names (directories are hardcoded in script for Docker compatibility)
# config file name
config_file="ubuntu-26.10-live-server.cfg"
# preseed file names ( Debian )
preseed_template="autoinstall_ubuntu-26.10-live-server-template.yml"
preseed_file="autoinstall_ubuntu-26.10-live-server.yml"
# Autoinstall files ( Ubuntu ) replaces preseed_file.
user_data_template="autoinstall_ubuntu-26.10-live-server-template.yml"
user_data_file="autoinstall_ubuntu-26.10-live-server.yml"
meta_data_file="meta-data"

# ## isolinux customization variables
isolinux_auto=true
isolinux_priority=critical
debian_installer_language=en_US
debian_installer_country=FR
debconf_frontend=noninteractive
console_setup_ask_detect=false

# Custom ISO output name
custom_iso_version="0.0.1"
custom_iso_comment="catalog"
custom_iso_name="ubuntu-26.10-live-server-amd64-${custom_iso_comment}-${custom_iso_version}.iso"
