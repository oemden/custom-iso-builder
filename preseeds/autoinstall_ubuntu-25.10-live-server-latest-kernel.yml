#cloud-config
autoinstall:
  version: 1
  
  # ======== autoinstall Config  - Version 0.1.0 ========
  # Usage: iso bootable install

  # Basic localization
  locale: en_US.UTF-8
  keyboard:
    layout: us
  
  # Network (DHCP auto-config)
  # Disabled for now as we want to test a static ip and it seems to interfere with the cloudinit networking.
  # update: no impact on static IP failure with cloudinit networking and vmware guestinfo datasource.
  # network:
  #   network:
  #     version: 2
  #     ethernets:
  #       any:
  #         match:
  #           name: en*
  #         dhcp4: true
  
  # Disk partitioning (equivalent to preseed "atomic")
  storage:
    layout:
      name: direct
  
  # ############ set users start  ###############
  # #### This Never worked ever. I now create all users with cloudinit for the VM, No usage of identity nor user-data with autoinstall until I find what is wrong.
  # # Set generic Hostname
  # identity:
  #   hostname: localhost
  #   can't login anymore in ubuntu -> test with user-data below
  #   username: setup_admin
  #   password: "$6$ycf9sjoobhOfX78H$vk9BApLFjAKAoW3drZNQwXF0aQCZaXlphTgfiLLkjg0toKg2oYL7Tqr8k3RmYv5BFT.r7.8oPUpDy/u4VGY9U1"
  # # Minimal user for SSH access

  user-data:
    users:
      - name: setup_admin
        gecos: 'Setup Admin'
        passwd: '$6$ycf9sjoobhOfX78H$vk9BApLFjAKAoW3drZNQwXF0aQCZaXlphTgfiLLkjg0toKg2oYL7Tqr8k3RmYv5BFT.r7.8oPUpDy/u4VGY9U1'
        groups: adm, cdrom, dip, lxd, plugdev, sudo
        shell: /bin/bash
        lock_passwd: False
  # ############ set users end  ###############

  # SSH server
  ssh:
    install-server: true
    allow-pw: false
  
  # Minimal packages
  packages:
    - cloud-init
    - openssh-server
    - open-vm-tools
    - sudo
    - sed
    - curl
    - nano
    - policykit-1

  # Updates from both the security and updates pockets are installed.
  updates: all

  # Post-install: SSH + sudo only
  late-commands:
    # - echo 'setup_admin ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/setup_admin
    # - chmod 440 /target/etc/sudoers.d/setup_admin
    - curtin in-target --target=/target -- systemctl enable ssh
    - curtin in-target --target=/target -- systemctl start ssh
    - echo "deleting Subiquity files"
    - echo "Cleaning cloud-init state for post-boot execution"
    - echo "Removing Subiquity blocking files -- begin"
    - echo "Resetting cloud-init for fresh guestinfo datasource detection"
    - curtin in-target --target=/target -- rm -f /etc/cloud/cloud.cfg.d/00-subiquity-disable-cloudinit-networking.cfg
    - curtin in-target --target=/target -- rm -f /etc/cloud/cloud.cfg.d/99-installer.cfg
    - |
      curtin in-target --target=/target -- bash -c 'sed -i "s/^datasource_list:/#datasource_list:/g" /etc/cloud/cloud.cfg.d/90_dpkg.cfg'
    - |
      curtin in-target --target=/target -- bash -c 'echo "datasource_list: [ VMware, OVF, NoCloud, None ]" >> /etc/cloud/cloud.cfg.d/90_dpkg.cfg'
    - | 
      curtin in-target --target=/target -- bash -c 'echo "disable_vmware_customization: false" >> /etc/cloud/cloud.cfg'
    - curtin in-target --target=/target -- cloud-init clean --logs --machine-id
    - curtin in-target --target=/target -- truncate -s 0 /etc/machine-id
    - echo "Removed Subiquity blocking files"
    - |
      echo "Installing latest kernel"
      curtin in-target --target=/target -- bash -c 'add-apt-repository ppa:cappelikan/ppa'
      curtin in-target --target=/target -- bash -c 'apt update && apt install mainline -y'
      curtin in-target --target=/target -- bash -c 'mainline install 6.18.7'

  # Final message
  final-message: "The system is finally installed. Rebooting now..."
  reboot: true

# Documentation:
# https://canonical-subiquity.readthedocs-hosted.com/en/latest/reference/autoinstall-reference.html
# Latest Kernel Installation:
# https://github.com/cappelikan/mainline
#       curtin in-target --target=/target -- bash -c 'mainline install 6.18.7'
# or
#       curtin in-target --target=/target -- bash -c 'mainline install-latest'
